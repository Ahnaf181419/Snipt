name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get
        working-directory: snipt

      - run: flutter analyze
        working-directory: snipt

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get
        working-directory: snipt

      - run: flutter test --reporter compact
        working-directory: snipt

  integration_test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get
        working-directory: snipt

      - run: flutter test integration_test --reporter compact
        working-directory: snipt

  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get
        working-directory: snipt

      - run: flutter build apk --debug
        working-directory: snipt
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: snipt/build/app/outputs/flutter-apk/app-debug.apk

  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - run: flutter pub get
        working-directory: snipt

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> snipt/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> snipt/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> snipt/android/key.properties
          echo "storeFile=${{ secrets.KEY_STORE_FILE }}" >> snipt/android/key.properties

      - run: flutter build apk --release
        working-directory: snipt
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: snipt/build/app/outputs/flutter-apk/app-release.apk
