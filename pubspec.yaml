name: snipt
description: "Snipt - Clipboard Manager for Android"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  
  # Database & Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  
  # Background Service
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.1
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Utilities
  share_plus: ^11.1.0
  intl: ^0.18.1
  uuid: ^4.2.1

  # Logging & Error Tracking
  talker_flutter: ^4.7.0
  talker_bloc_logger: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
